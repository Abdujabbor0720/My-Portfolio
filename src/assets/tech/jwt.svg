<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="8" fill="#000"/>
  <!-- JWT logo: three vertical segments with colors -->
  <!-- Left segment (pink) -->
  <rect x="8" y="10" width="9" height="28" rx="2" fill="#fb015b"/>
  <!-- Middle segment (cyan) -->
  <rect x="19.5" y="10" width="9" height="28" rx="2" fill="#00f2e6"/>
  <!-- Right segment (purple) -->
  <rect x="31" y="10" width="9" height="28" rx="2" fill="#d63aff"/>
  <!-- Dot connectors -->
  <circle cx="17" cy="24" r="1.5" fill="#888"/>
  <circle cx="30" cy="24" r="1.5" fill="#888"/>
</svg>
